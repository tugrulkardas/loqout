workflows:
  ios-testflight:
    name: LoqOut iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic Team integrations.
      app_store_connect: loqout_app_store_connect
    environment:
      flutter: 3.35.6
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.loqout.app
        EXTENSION_BUNDLE_ID: com.loqout.app.DeviceActivityMonitor
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Fetch App Store signing files
        script: |
          # Creates the distribution certificate and App Store profiles when missing.
          # Family Controls and the App Group must already be enabled on both App IDs.
          # This does not mark the build as internal-only, so external TestFlight stays available.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "Set APP_STORE_APPLE_ID in the Codemagic workflow variables."
            echo "App Store Connect → LoqOut → App Information → Apple ID."
            exit 1
          fi
          # Highest CFBundleVersion already on TestFlight, across versions.
          # A failed lookup must stop the build. Falling back to 0 uploads
          # build 1 again, which App Store Connect rejects as a duplicate.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --all-versions)
          echo "Latest TestFlight bundle version: $LATEST"
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "Could not read a numeric TestFlight build number: [$LATEST]"
              exit 1
              ;;
          esac
          BUILD_NUMBER=$((LATEST + 1))
          echo "Next bundle version: $BUILD_NUMBER"
          # The shield extension does not read FLUTTER_BUILD_NUMBER.
          sed -i '' "s/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/Runner.xcodeproj/project.pbxproj
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
