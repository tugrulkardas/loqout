workflows:
  ios-testflight:
    name: LoqOut iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic Team integrations.
      app_store_connect: loqout_app_store_connect
    environment:
      flutter: 3.35.6
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.loqout.app
        EXTENSION_BUNDLE_ID: com.loqout.app.DeviceActivityMonitor
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Fetch App Store signing files
        script: |
          # Creates the distribution certificate and App Store profiles when missing.
          # Family Controls and the App Group must already be enabled on both App IDs.
          # This does not mark the build as internal-only, so external TestFlight stays available.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "Set APP_STORE_APPLE_ID in the Codemagic workflow variables."
            echo "App Store Connect → LoqOut → App Information → Apple ID."
            exit 1
          fi
          # Build 1 is already registered in App Store Connect. A rejected
          # upload still consumes that number, and the TestFlight lookup
          # returns 0 when the build never finished processing.
          RAW=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --all-versions)
          echo "TestFlight lookup: [$RAW]"
          LATEST=$(printf '%s\n' "$RAW" | grep -Eo '[0-9]+' | tail -n 1)
          echo "Latest TestFlight bundle version: [${LATEST}]"
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "Could not read a numeric TestFlight build number."
              exit 1
              ;;
          esac
          BUILD_NUMBER=$((LATEST + 1))
          if [ "$BUILD_NUMBER" -lt 2 ]; then
            BUILD_NUMBER=2
          fi
          echo "Next bundle version: $BUILD_NUMBER"
          # Runner reads FLUTTER_BUILD_NUMBER. The shield extension and tests
          # do not, so stamp every literal project version.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/Runner.xcodeproj/project.pbxproj
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          IPA=$(echo build/ios/ipa/*.ipa)
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          BUNDLE_VERSION=$(plutil -extract CFBundleVersion raw -o - "$TMP"/Payload/*.app/Info.plist)
          echo "IPA CFBundleVersion: $BUNDLE_VERSION"
          if [ "$BUNDLE_VERSION" != "$BUILD_NUMBER" ]; then
            echo "IPA bundle version is $BUNDLE_VERSION, expected $BUILD_NUMBER."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
