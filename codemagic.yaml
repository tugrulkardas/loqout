workflows:
  ios-testflight:
    name: LoqOut iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic Team integrations.
      app_store_connect: loqout_app_store_connect
    environment:
      flutter: 3.35.6
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.loqout.app
        EXTENSION_BUNDLE_ID: com.loqout.app.DeviceActivityMonitor
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Fetch App Store signing files
        script: |
          # Creates the distribution certificate and App Store profiles when missing.
          # Family Controls and the App Group must already be enabled on both App IDs.
          # This does not mark the build as internal-only, so external TestFlight stays available.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          # Builds 1 through 3 are already on App Store Connect. A rejected
          # upload still consumes the number. Never fall below 4.
          BUILD_NUMBER=4
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            set +e
            RAW=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --all-versions 2>/tmp/asc-build-lookup.txt)
            STATUS=$?
            set -e
            echo "TestFlight lookup status: $STATUS"
            echo "TestFlight lookup stdout: [$RAW]"
            cat /tmp/asc-build-lookup.txt || true
            if [ "$STATUS" -eq 0 ] && printf '%s' "$RAW" | grep -Eq '^[0-9]+$'; then
              NEXT=$((RAW + 1))
              if [ "$NEXT" -gt "$BUILD_NUMBER" ]; then
                BUILD_NUMBER=$NEXT
              fi
            fi
          else
            echo "APP_STORE_APPLE_ID is not set. Using bundle version $BUILD_NUMBER."
          fi
          echo "CFBundleVersion that will be uploaded: $BUILD_NUMBER"
          if ! grep -A1 '<ArchiveAction' ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme | grep -q 'buildConfiguration = "Release"'; then
            echo "Runner archive configuration is not Release."
            exit 1
          fi
          # Runner reads FLUTTER_BUILD_NUMBER from the Flutter xcconfig.
          # The shield extension does not, so stamp its literal version too.
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/Runner.xcodeproj/project.pbxproj
          # Xcode script phases prefer this variable over the configuration name.
          # Release.xcconfig also sets it, so a leftover debug value cannot win.
          export FLUTTER_BUILD_MODE=release
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          IPA=$(echo build/ios/ipa/*.ipa)
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          APP_PLIST=$(find "$TMP/Payload" -maxdepth 2 -name Info.plist -path '*.app/Info.plist' ! -path '*.appex/*' | head -n 1)
          EXT_PLIST=$(find "$TMP/Payload" -name Info.plist -path '*.appex/Info.plist' | head -n 1)
          APP_VERSION=$(plutil -extract CFBundleVersion raw -o - "$APP_PLIST")
          EXT_VERSION=$(plutil -extract CFBundleVersion raw -o - "$EXT_PLIST")
          APP_SHORT=$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST")
          EXT_SHORT=$(plutil -extract CFBundleShortVersionString raw -o - "$EXT_PLIST")
          echo "App CFBundleVersion: $APP_VERSION ($APP_SHORT)"
          echo "Extension CFBundleVersion: $EXT_VERSION ($EXT_SHORT)"
          if [ "$APP_VERSION" != "$BUILD_NUMBER" ] || [ "$EXT_VERSION" != "$BUILD_NUMBER" ]; then
            echo "Refusing to publish. Expected bundle version $BUILD_NUMBER."
            exit 1
          fi
          if [ "$APP_SHORT" != "$EXT_SHORT" ]; then
            echo "Refusing to publish. App and extension short versions differ."
            exit 1
          fi
          if find "$TMP" -name kernel_blob.bin -print -quit | grep -q kernel_blob.bin; then
            echo "Refusing to publish. This IPA contains a Flutter debug snapshot."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
