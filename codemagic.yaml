workflows:
  ios-testflight:
    name: LoqOut iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name in Codemagic Team integrations.
      app_store_connect: loqout_app_store_connect
    environment:
      flutter: 3.35.6
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.loqout.app
        EXTENSION_BUNDLE_ID: com.loqout.app.DeviceActivityMonitor
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Fetch App Store signing files
        script: |
          # Creates the distribution certificate and App Store profiles when missing.
          # Family Controls and the App Group must already be enabled on both App IDs.
          # This does not mark the build as internal-only, so external TestFlight stays available.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "Set APP_STORE_APPLE_ID in the Codemagic workflow variables."
            echo "App Store Connect → LoqOut → App Information → Apple ID."
            exit 1
          fi
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          LATEST=0
          for n in "$TF" "$AS"; do
            case "$n" in
              ''|*[!0-9]*) ;;
              *)
                if [ "$n" -gt "$LATEST" ]; then
                  LATEST=$n
                fi
                ;;
            esac
          done
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
